name: Publish production website
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm --prefix functions ci
      - run: npm audit --audit-level=moderate && npm --prefix functions audit --omit=dev --audit-level=moderate
      - run: npm run check && npm test && npm run test:rules && npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:build
      - name: Build the public artifact
        run: npm run build
        env:
          EGY_APP_CHECK_SITE_KEY: ${{ vars.EGY_APP_CHECK_SITE_KEY }}
          EGY_VAPID_PUBLIC_KEY: ${{ vars.EGY_VAPID_PUBLIC_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
