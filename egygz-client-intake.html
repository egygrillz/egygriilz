<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<title>EGYGRILLZ — Design Details</title>
<script>
    // theme before first paint (no flash)
    (function () {
        try {
            var t = localStorage.getItem("egygz_intake_theme") || "auto";
            var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
    })();
</script>
<style>
    :root {
        --ink: #0a0a0a;
        --paper: #ffffff;
        --card: #ffffff;
        --soft: #f6f6f7;
        --line: #e8e8ea;
        --text: #0a0a0a;
        --sub: #6b7280;
        --faint: #9ca3af;
        --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
    html.dark {
        --ink: #f4f4f5;
        --paper: #0b0b0c;
        --card: #141416;
        --soft: #1a1a1e;
        --line: #26262b;
        --text: #f4f4f5;
        --sub: #a1a1aa;
        --faint: #71717a;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--paper); color: var(--text); line-height: 1.5;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        position: relative; overflow-x: hidden;
    }
    body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background:
            radial-gradient(900px 420px at 50% -12%, rgba(0,0,0,.05), transparent 70%),
            radial-gradient(circle at 1px 1px, rgba(0,0,0,.05) 1px, transparent 0);
        background-size: auto, 22px 22px;
    }
    html.dark body::before {
        background:
            radial-gradient(900px 420px at 50% -12%, rgba(255,255,255,.06), transparent 70%),
            radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
        background-size: auto, 22px 22px;
    }
    .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 20px 18px 44px; }

    /* ---------- hero ---------- */
    .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .hero .mark { width: 52px; height: 52px; object-fit: contain; }
    .brand { font-weight: 800; letter-spacing: .2em; font-size: 14px; text-transform: uppercase; }
    .brand small { display: block; font-weight: 600; letter-spacing: .16em; color: var(--sub); font-size: 9.5px; margin-top: 3px; }
    .tools { margin-inline-start: auto; display: flex; gap: 8px; }
    .tool {
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: grid; place-items: center;
        font-size: 12px; font-weight: 700; transition: transform .15s, border-color .15s;
    }
    .tool:hover { border-color: var(--text); }
    .tool:active { transform: scale(.94); }
    .tool svg { width: 17px; height: 17px; }
    .badge {
        display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
        font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub);
        border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px;
    }
    .badge i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: block; }
    .badge.expired i { background: #f59e0b; }

    /* ---------- progress ---------- */
    .progress { height: 5px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1); }
    .steps { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .steps span { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .14em; }
    .dots { display: flex; gap: 5px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: block; }
    .dots i.done { background: var(--ink); }
    .dots i.now { background: var(--ink); transform: scale(1.35); }

    /* ---------- cards ---------- */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; box-shadow: var(--shadow); }
    .step-enter { animation: stepIn .28s cubic-bezier(.2,.7,.3,1); }
    @keyframes stepIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: .01em; line-height: 1.15; }
    .hint { font-size: 12.5px; color: var(--sub); margin: 0 0 18px; }
    label.f { display:block; font-size:10.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; color: var(--sub); margin: 0 0 7px; }
    input[type=text], input[type=number], textarea {
        width:100%; padding: 14px 13px; border:1px solid var(--line); border-radius: 14px;
        font-size: 16px; font-family: inherit; background: var(--soft); color: var(--text); outline:none;
        transition: border-color .15s, background .15s;
    }
    input:focus, textarea:focus { border-color: var(--ink); background: var(--card); }
    textarea { resize: none; min-height: 84px; }
    .field { margin-bottom: 16px; }
    .opts { display: grid; gap: 10px; }
    .opt {
        display: flex; gap: 13px; align-items: flex-start; text-align: start; width: 100%;
        border: 1px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer;
        background: var(--card); color: var(--text); font-family: inherit;
        transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .opt:hover { border-color: var(--faint); }
    .opt:active { transform: scale(.99); }
    .opt.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
    .opt .glyph {
        flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
        background: linear-gradient(160deg, var(--soft), var(--card)); border: 1px solid var(--line); color: var(--ink);
    }
    .opt .glyph svg { width: 22px; height: 22px; }
    .opt b { display: block; font-size: 14.5px; font-weight: 700; }
    .opt em { display: block; font-style: normal; font-size: 12px; color: var(--sub); margin-top: 3px; }
    .opt .check { margin-inline-start: auto; align-self: center; opacity: 0; transition: opacity .15s; color: var(--ink); }
    .opt.sel .check { opacity: 1; }
    .opt .check svg { width: 18px; height: 18px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chip { font-size:10.5px; color:var(--sub); background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
    .note { font-size: 12.5px; color:#8a6d1d; background:#fffbeb; border:1px solid #fde68a; border-radius: 14px; padding: 12px 13px; }
    html.dark .note { color:#fcd34d; background:#2a2211; border-color:#7c5c11; }
    select {
        width:100%; padding: 14px 12px; border:1px solid var(--line); border-radius: 14px; font-size:16px;
        font-family: inherit; background: var(--soft); color: var(--text); outline:none; appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
        background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
    }
    html[dir=rtl] select { background-position: left 12px center; }

    /* ---------- nav ---------- */
    .actions { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; margin-top: 18px; padding: 14px 0 14px; background: linear-gradient(to bottom, transparent, var(--paper) 30%); }
    .btn {
        border-radius: 16px; padding: 16px 18px; font-size: 14px; font-weight: 750; letter-spacing: .02em;
        border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font-family: inherit;
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
    }
    .btn:active { transform: translateY(1px) scale(.995); }
    .btn svg { width: 17px; height: 17px; }
    .btn.primary {
        flex: 1; background: var(--ink); color: var(--paper); border-color: var(--ink);
        box-shadow: 0 10px 24px rgba(0,0,0,.16);
    }
    html.dark .btn.primary { box-shadow: 0 10px 26px rgba(0,0,0,.5); }
    .btn.primary:hover { box-shadow: 0 14px 30px rgba(0,0,0,.22); }
    .btn.ghost { flex: 0 0 auto; }
    .btn.block { width: 100%; }
    .btn.wa { background:#25D366; border-color:#25D366; color:#06331c; width:100%; }
    .btn[disabled] { opacity:.45; pointer-events:none; }

    /* ---------- done screen ---------- */
    .codebox {
        width:100%; min-height: 104px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
        word-break: break-all; background: var(--soft); border-radius: 14px; padding: 14px;
    }
    .sum { border:1px solid var(--line); border-radius:16px; padding: 14px; font-size: 13px; margin: 16px 0; background: var(--card); }
    .sum div { display:flex; justify-content:space-between; gap:14px; padding:6px 0; border-bottom:1px dashed var(--line); }
    .sum div:last-child { border-bottom:none; }
    .sum span:first-child { color: var(--sub); }
    .sum span:last-child { text-align: end; }
    footer { margin-top: 24px; font-size: 11px; color: var(--faint); text-align: center; }
    .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%);
        background: var(--ink); color: var(--paper); padding: 12px 17px; border-radius: 14px;
        font-size: 12.5px; transition: transform .28s cubic-bezier(.2,.7,.3,1); z-index: 40; max-width: 90vw; text-align:center;
    }
    .toast.show { transform: translate(-50%, 0); }
    .hidden { display: none !important; }
    .center { text-align: center; }
    .seal { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; margin: 0 auto 14px; }
    .seal svg { width: 24px; height: 24px; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .thumb { position: relative; flex: 0 0 auto; width: 68px; height: 68px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
    .thumb svg { width: 24px; height: 24px; opacity: .5; }
    .thumb .ri { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .opts.tiles { grid-template-columns: 1fr 1fr; }
    .opts.tiles.t3 { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .tiles .opt { flex-direction: column; gap: 10px; padding: 10px; position: relative; }
    .tiles .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; }
    .tiles.t3 .thumb { aspect-ratio: 1 / 1; }
    .tiles .opt .txt { width: 100%; }
    .tiles .opt .check { position: absolute; top: 16px; inset-inline-end: 16px; background: var(--ink); color: var(--paper); border-radius: 50%; padding: 3px; align-self: auto; margin: 0; }
    .tiles.t3 .opt b { font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="hero">
        <img class="mark" id="brandMark" src="" alt="EGYGRILLZ">
        <div>
            <div class="brand">EGYGRILLZ<small id="heroSub">Design details</small></div>
        </div>
        <div class="tools">
            <button class="tool" id="themeBtn" type="button" title="Theme">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
            </button>
            <button class="tool" id="langBtn" type="button">ع</button>
        </div>
    </div>

    <div id="badgeRow"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="steps">
        <span id="stepMeta"></span>
        <div class="dots" id="dots"></div>
    </div>

    <main id="stage"></main>

    <div class="actions" id="nav">
        <button class="btn ghost" id="backBtn" type="button">Back</button>
        <button class="btn primary" id="nextBtn" type="button">Continue</button>
    </div>

    <footer id="footNote">No prices are shown here — the studio confirms your quote after reviewing the details.</footer>
</div>
<div class="toast" id="toast"></div>

<script>

   1) Client opens a private one-time link (?k=token) sent by the studio.
   2) Answers a few short questions (no prices shown).

   The studio's link registry lives in the PANEL's browser, so a client's
   browser can't see it — an unknown token is therefore treated as VALID

const IMG = (() => {
    const BASES = ["https://egygrillz.com/", "https://raw.githubusercontent.com/egygrillz/egygriilz/main/"];
    const A = {
        materials: { chrome: ["chrome", "cobalt"], titanium: ["titanium"], silver: ["silver", "sterling", "925"], gold: ["gold"] },
        levels: { "0.5": ["0.5", "05", "bars", "bar"], "1": ["1", "solid"], "2": ["2", "open", "openface"], "3": ["3", "mid", "middetail"], "4": ["4", "complex"], "5": ["5", "scorpion", "heavy"], "6": ["6", "ultimate"] },
        plating: { none: ["none", "no", "without"], blackgold: ["black", "blackgold"], whitegold: ["white", "whitegold"], rosegold: ["rose", "rosegold", "pink"], silverplating: ["silver", "silverplating"] }
    };
    const KEY = "egygz_img_index_v2";
    let files = {};
    const ready = (async () => {
        try { const c = JSON.parse(localStorage.getItem(KEY) || "null"); if (c && Date.now() - c.t < 6 * 3600e3) { files = c.f; return; } } catch (e) {}
        try {
            const out = {};
            await Promise.all(Object.keys(A).map(async f => {
                const r = await fetch("https://api.github.com/repos/egygrillz/egygriilz/contents/" + f + "?ref=main");
                if (r.ok) out[f] = (await r.json()).filter(x => x.type === "file" && /\.(jpe?g|png|webp|avif|gif)$/i.test(x.name)).map(x => x.name);
            }));
            if (Object.keys(out).length) { files = out; try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), f: out })); } catch (e) {} }
        } catch (e) {}
    })();
    const test = (b, a) => /^[0-9.]+$/.test(a) ? new RegExp("(^|[^0-9.])" + a.replace(/\./g, "\\.") + "($|[^0-9.])").test(b) : b.replace(/[^a-z]/g, "").includes(a);
    const find = (f, k) => (files[f] || []).find(n => { const b = n.toLowerCase().replace(/\.[a-z0-9]+$/, ""); return (A[f][k] || [k]).some(a => test(b, a)); });
    function hydrate(root) {
        (root || document).querySelectorAll("img[data-rf]").forEach(im => {
            if (im.dataset.on) return; im.dataset.on = 1;
            const f = im.dataset.rf, k = im.dataset.rk, n = find(f, k), c = [];
            const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
            const al = (A[f][k] || [k]).slice(0, 3);
            const names = n ? [n] : al.flatMap(a => [a, cap(a)]).flatMap(a => ["jpg", "jpeg", "png", "webp"].map(e => a + "." + e));
            BASES.forEach(b => names.forEach(x => c.push(b + f + "/" + encodeURIComponent(x))));
            let i = 0;
            im.onload = () => { im.hidden = false; };
            im.onerror = () => { if (++i < c.length) im.src = c[i]; else im.remove(); };
            im.src = c[0];
        });
    }
    return { ready, hydrate };
})();

/* ---------- reliable copy (clipboard API, then iOS/WebView-safe fallback) ---------- */
async function robustCopy(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
    try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
    } catch (e) { return false; }
}

/* ---------------- one-time link handling ----------------
   The token registry is created in the PANEL's browser (localStorage), so on a
   client's phone it is always empty. Unknown token  ->  treat as valid private
   link (never block a real client). Only a token this device KNOWS and already
   used shows the "already used" screen.                                  */
const TOKENS_KEY = "egygz_intake_tokens";
function readTokens() { try { return JSON.parse(localStorage.getItem(TOKENS_KEY) || "{}") || {}; } catch (e) { return {}; } }
function writeTokens(t) { try { localStorage.setItem(TOKENS_KEY, JSON.stringify(t)); } catch (e) {} }
function tokenStatus() {
    if (!TOKEN) return "none";
    const t = readTokens()[TOKEN];
    if (!t) return "unverified";   // created on another device — allow the flow
    return t.used ? "used" : "live";
}
function burnToken() {
    if (!TOKEN) return;
    const t = readTokens();
    if (t[TOKEN]) { t[TOKEN].used = true; t[TOKEN].usedAt = Date.now(); writeTokens(t); }
}

function render() {
    const L = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = L.dir;
    $("#heroSub").textContent = L.sub;
    $("#footNote").textContent = L.footer;
    $("#langBtn").textContent = state.lang === "en" ? "ع" : "EN";
    $("#backBtn").textContent = L.back;
    $("#nextBtn").textContent = L.next;
    $("#themeBtn").title = "Theme";

    const status = tokenStatus();
    // "unknown"/"unverified" = the link was created on the studio's device — let the client in.
    if (status === "used") { renderExpired(); return; }
    $("#badgeRow").innerHTML = `<span class="badge"><i></i>${esc((status === "live" || status === "unverified") ? L.badgeLive : L.badgePlain)}</span>`;

    const steps = currentSteps();
    const key = steps[state.step];
    const a = state.answers;
    const noStones = a.m === "chrome" || a.m === "titanium";

    $("#bar").style.width = Math.round(((state.step + 1) / steps.length) * 100) + "%";
    $("#stepMeta").textContent = L.step.replace("{a}", state.step + 1).replace("{b}", steps.length);
    $("#dots").innerHTML = steps.map((_, i) => `<i class="${i === state.step ? "now" : i < state.step ? "done" : ""}"></i>`).join("");
    $("#nav").classList.toggle("hidden", key === "done");
    $("#backBtn").disabled = state.step === 0;

    let html = "";
    if (key === "name") {
        html = `<div class="card step-enter"><h1>${esc(L.name.t)}</h1><p class="hint">${esc(L.name.h)}</p>
            <div class="field"><label class="f">${esc(L.name.c)}</label><input type="text" data-input="c" value="${esc(a.c)}" maxlength="40" autocomplete="name" autofocus></div>
            <div class="field" style="margin-bottom:0"><label class="f">${esc(L.name.d)}</label><input type="text" data-input="n" value="${esc(a.n)}" maxlength="30" placeholder="${esc(L.name.dp)}"></div></div>`;
    }
    if (key === "mat") {
        html = `<div class="card step-enter"><h1>${esc(L.mat.t)}</h1><p class="hint">${esc(L.mat.h)}</p>${optsHtml("material", a.m, true)}`;
        if (a.m === "gold") {
            html += `<div class="field" style="margin:16px 0 0"><label class="f">${esc(L.karat)}</label>${selHtml("karat", a.karat)}</div>
                     <div class="field" style="margin:16px 0 0"><label class="f">${esc(L.goldRate)}</label><input type="number" data-input="rl_gold" value="${esc(a.goldRate || "")}" inputmode="numeric">
                     <p class="hint" style="margin:8px 0 0">${esc(L.goldRateHint)}</p></div>`;
        }
        html += `</div>`;
    }
    if (key === "teeth") {
        html = `<div class="card step-enter"><h1>${esc(L.teethT)}</h1><p class="hint">${esc(L.teethH)}</p>
            <div class="field" style="margin-bottom:0"><label class="f">${esc(L.teethL)}</label><input type="number" data-input="t" min="1" max="16" value="${esc(a.t)}" inputmode="numeric" autofocus></div></div>`;
    }
    if (key === "lvl") {
        html = `<div class="card step-enter"><h1>${esc(L.lvlT)}</h1><p class="hint">${esc(L.lvlH)}</p>${optsHtml("level", a.l, true)}</div>`;
    }
    if (key === "st") {
        html = noStones
            ? `<div class="card step-enter"><h1>${esc(L.stT)}</h1><div class="note">${esc(L.noStones)}</div></div>`
            : `<div class="card step-enter"><h1>${esc(L.stT)}</h1><p class="hint">${esc(L.stH)}</p>${optsHtml("stones", a.s, true)}</div>`;
    }
    if (key === "stdet") {
        if (a.s === "accent") {
            const needsRate = a.at === "labgrown" || a.at === "natural";
            html = `<div class="card step-enter"><h1>${esc(L.stT)}</h1>
                <div class="field"><label class="f">${esc(L.aCount)}</label><input type="number" data-input="sc" min="1" value="${esc(a.sc)}" inputmode="numeric"></div>
                <div class="field"><label class="f">${esc(L.aType)}</label>${selHtml("stoneType", a.at)}</div>
                <div class="field" style="margin-bottom:0"><label class="f">${esc(L.aSetting)}</label>${selHtml("setting", a.ss)}</div>
                ${needsRate ? `<div class="field" style="margin:16px 0 0"><label class="f">${esc(L.stRate)}</label><input type="number" data-input="rl" value="${esc(a.rl)}" inputmode="numeric" placeholder="—"></div>` : ""}</div>`;
        } else {
            const bars = a.l === "0.5";
            const needsRate = a.ft === "labgrown" || a.ft === "natural";
            html = `<div class="card step-enter"><h1>${esc(L.stT)}</h1>` + (bars ? `<div class="note">${esc(L.barsFull)}</div>` : `
                <div class="field"><label class="f">${esc(L.fType)}</label>${selHtml("stoneType", a.ft)}</div>
                <div class="field" style="margin-bottom:0"><label class="f">${esc(L.fCover)}</label>${selHtml("coverage", a.cv)}</div>
                ${needsRate ? `<div class="field" style="margin:16px 0 0"><label class="f">${esc(L.stRateFull)}</label><input type="number" data-input="rf" value="${esc(a.rf)}" inputmode="numeric" placeholder="—"></div>` : ""}`) + `</div>`;
        }
    }
    if (key === "fin") {
        html = `<div class="card step-enter"><h1>${esc(L.finT)}</h1><p class="hint">${esc(L.finH)}</p>
            <div class="field"><label class="f">${esc(L.plating)}</label>${optsHtml("plating", a.pl, true)}</div>
            <div class="field"><label class="f">${esc(L.enamel)}</label>${selHtml("enamel", a.en)}</div>
            <div class="field" style="margin-bottom:0"><label class="f">${esc(L.engraving)}</label>${selHtml("engraving", a.eg)}</div></div>`;
    }
    if (key === "time") {
        html = `<div class="card step-enter"><h1>${esc(L.timeT)}</h1><p class="hint">${esc(L.timeH)}</p>
            <div class="field"><label class="f">${esc(L.timeline)}</label>${selHtml("timeline", a.tl)}</div>
            <div class="field" style="margin-bottom:0"><label class="f">${esc(L.mold)}</label>${selHtml("mold", a.md)}</div></div>`;
    }
    if (key === "notes") {
        html = `<div class="card step-enter"><h1>${esc(L.notesT)}</h1><p class="hint">${esc(L.notesH)}</p>
            <div class="field" style="margin-bottom:0"><label class="f">${esc(L.notesL)}</label><textarea data-input="nt" maxlength="300">${esc(a.nt)}</textarea></div></div>`;
    }
    if (key === "done") {
        const code = makeCode();
        html = `<div class="card step-enter"><div class="center" style="margin-bottom:14px">
                <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
                <h1>${esc(L.doneT)}</h1><p class="hint" style="margin-bottom:0">${esc(L.doneH)}</p>
            </div>
            <label class="f">${esc(L.codeL)}</label>
            <textarea class="codebox" id="codeBox" readonly>${esc(code)}</textarea>
            ${summaryHtml()}
            <div style="display:flex;flex-direction:column;gap:10px">
                ${WA_NUMBER ? `<a class="btn wa" style="text-decoration:none" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(messageText())}" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-1.6-.5-3.4-2-4.5-3.7-.6-.9-1-2-1-2.7 0-.7.4-1.5.9-1.8.2-.1.4-.1.6-.1h.4c.2 0 .3 0 .5.4l.7 1.7c.1.2 0 .4-.1.5l-.4.5c-.1.2-.2.3 0 .6.5.8 1 1.4 1.9 2 .3.2.5.2.7 0l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.4.2.4.3.4.5s0 .6-.2 1z"/></svg>
                    ${esc(L.wa)}</a>` : ""}
                <button class="btn primary block" type="button" id="copyMsgBtn">${esc(L.copyMsg)}</button>
                <button class="btn block" type="button" id="copyCodeBtn">${esc(L.copyCode)}</button>
            </div></div>`;
        if (!state.burned) { burnToken(); state.burned = true; }
    }
    const stage = $("#stage");
    stage.innerHTML = html;
    if (state._shown === key) stage.querySelectorAll(".step-enter").forEach(e => e.classList.remove("step-enter"));
    state._shown = key;
    IMG.ready.then(() => IMG.hydrate(stage));
    $("#nextBtn").textContent = L.next;

    if (key === "done") {
        if ($("#copyCodeBtn")) $("#copyCodeBtn").onclick = () => copy(code, L.copied, L.copyFail);
        if ($("#copyMsgBtn")) $("#copyMsgBtn").onclick = () => copy(messageText(), L.copied, L.copyFail);
    }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
    const optBtn = e.target.closest("[data-opt]");
    if (optBtn) {
        const key = optBtn.dataset.opt, val = optBtn.dataset.val;
        if (key === "material") {
            state.answers.m = val;
            if (val === "chrome" || val === "titanium") state.answers.s = "none";
            if (val !== "gold") state.answers.goldRate = "";
        } else if (key === "level") state.answers.l = val;
        else if (key === "plating") state.answers.pl = val;
        else if (key === "stones") state.answers.s = val;
        render();
        return;
    }
});
document.addEventListener("input", e => {
    const el = e.target.closest("[data-input]");
    if (!el) return;
    const key = el.dataset.input;
    if (key === "rl_gold") state.answers.goldRate = el.value;
    else if (key === "sc" || key === "t") state.answers[key] = el.value.replace(/[^0-9]/g, "");
    else state.answers[key] = el.value;
});
document.addEventListener("change", e => {
    const el = e.target.closest("[data-input]");
    if (!el || el.tagName !== "SELECT") return;
    const key = el.dataset.input;
    if (key === "stoneType") state.answers[state.answers.s === "accent" ? "at" : "ft"] = el.value;
    else if (key === "karat") state.answers.karat = el.value;
    else if (key === "setting") state.answers.ss = el.value;
    else if (key === "coverage") state.answers.cv = el.value;
    else if (["plating", "enamel", "engraving", "timeline", "mold"].includes(key)) state.answers[{ plating: "pl", enamel: "en", engraving: "eg", timeline: "tl", mold: "md" }[key]] = el.value;
    render();
});

function validate() {
    const steps = currentSteps();
    const key = steps[state.step];
    const a = state.answers;
    const L = I18N[state.lang];
    if (key === "name" && !a.c.trim()) { toast(L.needName); return false; }
    if (key === "mat" && !a.m) { toast(L.needMat); return false; }
    if (key === "teeth") {
        const n = parseInt(a.t, 10);
        if (!n || n < 1 || n > 16) { toast(L.needTeeth); return false; }
    }
    return true;
}
$("#nextBtn").onclick = () => {
    if (!validate()) return;
    state.step = Math.min(state.step + 1, currentSteps().length - 1);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
};
$("#backBtn").onclick = () => {
    state.step = Math.max(0, state.step - 1);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
};
$("#langBtn").onclick = () => {
    state.lang = state.lang === "en" ? "ar" : "en";
    render();
};
$("#themeBtn").onclick = () => {
    const order = ["auto", "light", "dark"];
    const next = order[(order.indexOf(getTheme()) + 1) % order.length];
    try { localStorage.setItem("egygz_intake_theme", next); } catch (e) {}
    setTheme(next);
    toast("Theme: " + next);
};
if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => { if (getTheme() === "auto") setTheme("auto"); };
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
}

/* ---------------- code + message ---------------- */
function b64urlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function makeCode() {
    const a = state.answers;
    const p = new URLSearchParams();
    p.set("c", a.c.trim());
    p.set("n", a.n.trim());
    p.set("m", a.m || "chrome");
    if (a.m === "gold") { p.set("k", a.karat); if (a.goldRate) p.set("gr", a.goldRate); }
    p.set("t", String(parseInt(a.t, 10) || 6));
    p.set("l", a.l);
    p.set("s", a.s);
    if (a.s === "accent") { p.set("sc", a.sc); p.set("at", a.at); p.set("ss", a.ss); if (a.rl) p.set("ra", a.rl); }
    if (a.s === "fulliced") { p.set("ft", a.ft); if (a.l !== "0.5") p.set("cv", a.cv); if (a.rf) p.set("rf", a.rf); }
    p.set("pl", a.pl); p.set("en", a.en); p.set("eg", a.eg);
    p.set("tl", a.tl); p.set("md", a.md);
    if (a.nt.trim()) p.set("nt", a.nt.trim());
    return "EGZ1:" + b64urlEncode(p.toString());
}
function summaryRows() {
    const a = state.answers;
    const L = I18N[state.lang];
    const rows = [];
    rows.push([L.sum.n, [a.c, a.n].filter(Boolean).join(" — ")]);
    rows.push([L.sum.m, a.m === "gold" ? `${labelFor("material", "gold")} ${a.karat}K` : labelFor("material", a.m)]);
    rows.push([L.sum.t, a.t]);
    rows.push([L.sum.l, labelFor("level", a.l)]);
    let stonesTxt = labelFor("stones", a.s);
    if (a.s === "accent") stonesTxt = `${L.stAccent} · ${a.sc}× ${labelFor("stoneType", a.at)} · ${labelFor("setting", a.ss)}`;
    if (a.s === "fulliced") stonesTxt = a.l === "0.5" ? labelFor("stones", "fulliced") : `${labelFor("stones", "fulliced")} · ${labelFor("stoneType", a.ft)} · ${labelFor("coverage", a.cv)}`;
    rows.push([L.sum.s, stonesTxt]);
    const fin = [a.pl !== "none" && labelFor("plating", a.pl), a.en !== "none" && labelFor("enamel", a.en), a.eg !== "none" && labelFor("engraving", a.eg)].filter(Boolean);
    rows.push([L.sum.f, fin.length ? fin.join(" · ") : L.none]);
    rows.push([L.sum.tl, labelFor("timeline", a.tl)]);
    rows.push([L.sum.md, labelFor("mold", a.md)]);
    if (a.nt.trim()) rows.push([L.sum.nt, a.nt.trim()]);
    return rows;
}
function summaryHtml() {
    return `<div class="sum">` + summaryRows().map(r =>
        `<div><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("") + `</div>`;
}
function messageText() {
    const L = I18N[state.lang], ar = state.lang === "ar";
    const rule = "\u2500".repeat(16);
    const rows = summaryRows().map(r => `${r[0]}: ${r[1]}`).join("\n");
    const intro = ar ? "مرحبًا، تفاصيل التصميم الخاصة بي كما يلي." : "Good day. Please find my design details below.";
    return `EGYGRILLZ\nBeyond Jewelry\n${rule}\n\n${intro}\n\n${rows}\n\n${rule}\n${L.codeL}\n${makeCode()}`;
}
async function copy(text, okMsg, failMsg) {
    if (await robustCopy(text)) toast(okMsg);
    else { const b = $("#codeBox"); if (b) { b.focus(); b.select(); } toast(failMsg); }
}

/* ---------------- boot ---------------- */
setTheme(getTheme());
render();
</script>
</body>
</html>
