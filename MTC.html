<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module">
    import { requireAuth } from '/assets/firebase-auth-gate.js?v=3';
    try {
      await requireAuth();
      document.documentElement.classList.add('auth-ready');
    } catch (e) {
      console.error(e);
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#e0e0e0">Authentication unavailable. Please refresh and sign in.</div>';
      document.documentElement.classList.add('auth-ready');
    }
  </script>
  <style>
    html:not(.auth-ready) body > :not(#egygz-auth-gate) { display: none !important; }
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGYGRILLZ — Catalog &amp; Media Diagnostics</title>
  <link rel="canonical" href="https://egygrillz.com/MTC">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Courier New', monospace; background:#0a0a0a; color:#e0e0e0; min-height:100vh; padding:30px; }
    h1 { font-family:sans-serif; font-size:22px; color:#fff; margin-bottom:4px; }
    .sub { font-size:12px; color:#777; margin-bottom:24px; }
    .bar { display:flex; gap:10px; margin-bottom:18px; }
    .btn { background:#fff; color:#000; border:none; padding:11px 22px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px; cursor:pointer; border-radius:3px; }
    .btn:disabled { background:#333; color:#777; cursor:not-allowed; }
    .stat-row { display:flex; gap:14px; max-width:820px; margin-bottom:18px; }
    .stat { background:#111; border:1px solid #222; padding:14px 16px; border-radius:4px; flex:1; text-align:center; }
    .stat-val { font-size:26px; font-weight:700; color:#fff; display:block; }
    .stat-lbl { font-size:10px; color:#777; text-transform:uppercase; letter-spacing:1px; margin-top:4px; display:block; }
    .ok-c { color:#8b8b8b; } .warn-c { color:#9f9f9f; } .err-c { color:#787878; }
    .log-wrap { background:#0d0d0d; border:1px solid #222; border-radius:6px; overflow:hidden; max-width:900px; }
    .log-header { background:#111; padding:10px 16px; font-size:11px; color:#777; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #222; display:flex; justify-content:space-between; }
    .log { padding:16px; height:480px; overflow-y:auto; font-size:12px; line-height:1.75; }
    .ok { color:#8b8b8b; } .err { color:#787878; } .warn { color:#9f9f9f; } .info { color:#848484; } .dim { color:#666; }
  </style>
</head>
<body>
  <h1>EGYGRILLZ — Catalog &amp; Media Diagnostics</h1>
  <p class="sub">Verifies every entry and asset path inside assets/images/catalog.json (read-only local check).</p>

  <div class="bar">
    <button class="btn" id="run-btn" onclick="runAudit()">Run Catalog Audit</button>
  </div>

  <div class="stat-row">
    <div class="stat"><span class="stat-val" id="s-items">0</span><span class="stat-lbl">Catalog Items</span></div>
    <div class="stat"><span class="stat-val ok-c" id="s-ok">0</span><span class="stat-lbl">Verified Files</span></div>
    <div class="stat"><span class="stat-val warn-c" id="s-warn">0</span><span class="stat-lbl">Missing Media</span></div>
    <div class="stat"><span class="stat-val err-c" id="s-err">0</span><span class="stat-lbl">Broken Links</span></div>
  </div>

  <div class="log-wrap">
    <div class="log-header">
      <span>Diagnostic Output</span>
      <button onclick="document.getElementById('log').innerHTML=''" style="background:none;border:none;color:#777;cursor:pointer;font-size:11px;">Clear</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <script>
    function log(msg, cls) {
      var el = document.createElement('div');
      el.className = cls || '';
      el.textContent = msg;
      var box = document.getElementById('log');
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    function itemMediaUrl(item, file) {
      var f = String(file || '').trim();
      if (/^(https?:|data:|\/)/i.test(f)) return f;
      var folder = item.folder || item.id || '';
      if (item.category === 'grillz-gallery' && (!folder || folder === '000001')) {
        return '/assets/images/grillz-gallery/' + f;
      }
      return '/assets/images/' + item.category + '/' + folder + '/' + f;
    }

    async function runAudit() {
      var btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.textContent = 'Running Audit…';
      document.getElementById('log').innerHTML = '';
      var ok = 0, warn = 0, err = 0;

      try {
        var res = await fetch('/assets/images/catalog.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var catalog = await res.json();
        if (!Array.isArray(catalog)) throw new Error('catalog.json is not an array');

        document.getElementById('s-items').textContent = catalog.length;
        log('Loaded catalog.json — ' + catalog.length + ' entries', 'info');

        for (var i = 0; i < catalog.length; i++) {
          var item = catalog[i];
          var media = (item.images || []).concat(item.videos || []);
          if (!media.length) {
            warn++;
            log('WARN ' + item.id + ' (' + item.category + '): no images or videos listed', 'warn');
            continue;
          }
          for (var j = 0; j < media.length; j++) {
            var url = itemMediaUrl(item, media[j]);
            try {
              var r = await fetch(url, { method: 'HEAD' });
              if (r.ok) {
                ok++;
              } else {
                err++;
                log('MISSING ' + item.id + ': ' + url + ' (HTTP ' + r.status + ')', 'err');
              }
            } catch (e) {
              err++;
              log('ERROR ' + item.id + ': ' + url + ' (' + e.message + ')', 'err');
            }
          }
          document.getElementById('s-ok').textContent = ok;
          document.getElementById('s-warn').textContent = warn;
          document.getElementById('s-err').textContent = err;
        }
        log('Audit complete — ' + ok + ' verified, ' + warn + ' warnings, ' + err + ' missing.', err ? 'err' : 'ok');
      } catch (e) {
        log('Audit failed: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Catalog Audit';
      }
    }
  </script>
</body>
</html>
